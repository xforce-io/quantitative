id: reviewer-approved
evidence:
  path: "review/reviewer/verdict.json"
  check:
    - field: approved
      equals: true
    - field: results.long_proxy_coverage_years
      gte: 10
    - field: results.best_oos_annual_return
      gte: 0.13
    - field: results.best_oos_max_drawdown
      gte: -0.25
    - field: results.return_improvement_vs_baseline
      gte: 0.01
    - field: results.real_etf_modes_validated_count
      gte: 1
    - field: results.execution_audit_passed
      equals: true
    # 实盘口径不退步：real_etf_full 年化相对上一次 KEEP 同口径的退步不得超过 0.5pp
    # 单位为 percentage points（如 -1.69 表示退步 1.69pp）。首轮无 prior KEEP 时填 0.0。
    - field: results.per_mode_comparison.real_etf_full.regression_vs_last_keep_pp
      gte: -0.5
    # 全口径 MDD 硬护栏：任一 status==success 的 mode 都不得突破 -25%
    # 未运行的 mode 在 verdict 中 candidate_mdd 填 0.0 以使本检查空过
    - field: results.per_mode_comparison.index_proxy.candidate_mdd
      gte: -0.25
    - field: results.per_mode_comparison.real_etf_full.candidate_mdd
      gte: -0.25
    # TODO(P0-2): real_etf_subset 受 2021-01~06 单折 -71.83% 异常影响（pre-existing），
    # MDD 长期挂在 -48.72%。P0-2 修复（数据/ETF 上市过滤）完成后再启用本检查。
    # - field: results.per_mode_comparison.real_etf_subset.candidate_mdd
    #   gte: -0.25
