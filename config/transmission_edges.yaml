# config/transmission_edges.yaml
edges:
  - source: DXY
    target: gold
    direction: inverse
    lag_min_days: 0
    lag_max_days: 1
    threshold_pct: 0.8
    initial_strength: 0.72
    source_ticker: DX-Y.NYB
    target_ticker: GC=F

  - source: DXY
    target: copper
    direction: inverse
    lag_min_days: 1
    lag_max_days: 3
    threshold_pct: 1.0
    initial_strength: 0.58
    source_ticker: DX-Y.NYB
    target_ticker: HG=F

  - source: DXY
    target: a_share_northbound
    direction: inverse
    lag_min_days: 1
    lag_max_days: 3
    threshold_pct: 1.0
    initial_strength: 0.55
    source_ticker: DX-Y.NYB
    target_ticker: null

  - source: gold
    target: a_share_gold_sector
    direction: direct
    lag_min_days: 0
    lag_max_days: 2
    threshold_pct: 1.5
    initial_strength: 0.65
